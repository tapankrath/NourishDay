<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EatRight">
<meta name="theme-color" content="#16181F">
<meta name="description" content="Daily meal plans — high protein, low carb. Regular, Low-GI & Treat Day modes.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>EatRight — Daily Meal Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --night:#141C22;--deep:#1A2530;--card:#182030;--bg:#0F161C;
  --accent:#0A6E9A;
  --accent2:#38BDF8;
  --accent-dim:rgba(56,189,248,.12);
  --accent-border:rgba(56,189,248,.20);
  --orange:#C07A4A;--blue:#0A6E9A;--teal:#2A9D8F;--purple:#7B6FC4;
  --ink:#E2EBF0;--ink2:rgba(226,235,240,.70);--ink3:rgba(226,235,240,.38);--ink4:rgba(226,235,240,.08);
  --border:rgba(56,189,248,.10);--border2:rgba(56,189,248,.18);
  --frame:rgba(56,189,248,.14);
  --green:#0A6E9A;--lime:#38BDF8;
}
html,body{background:var(--bg);font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100%;overscroll-behavior:none}

.app{
  max-width:420px;margin:0 auto;padding-bottom:56px;position:relative;
  box-shadow:0 0 0 1px var(--frame),0 0 40px rgba(56,189,248,.05);
  min-height:100vh;background:var(--night);
}
.app::before{
  content:'';position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:min(420px,100vw);height:2px;
  background:linear-gradient(90deg,transparent 5%,var(--teal) 25%,var(--accent2) 55%,rgba(125,211,248,.6) 75%,transparent 95%);
  opacity:.5;z-index:10;pointer-events:none;
}

.status-bar-spacer{background:var(--night);height:max(env(safe-area-inset-top),44px)}
.hdr{background:var(--night);padding:10px 14px 0;position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent2),transparent);opacity:.15;}

.logo-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{
  width:38px;height:38px;background:var(--accent);border-radius:11px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 14px rgba(10,110,154,.40);
}
.logo-mark svg{width:22px;height:22px}
.logo-name{font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.8px;line-height:1}
.logo-sub{font-size:9px;font-weight:800;color:var(--accent2);margin-top:2px;letter-spacing:.12em;text-transform:uppercase}

.mode-tabs{display:flex;background:rgba(255,255,255,.04);border-radius:9px;padding:3px;gap:2px;border:1px solid var(--ink4)}
.mode-tab{
  padding:6px 10px;border-radius:7px;border:none;cursor:pointer;
  font-size:10px;font-weight:900;font-family:'Nunito',sans-serif;
  color:var(--ink3);background:none;transition:all .18s;
  white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;
}
.mode-tab.on{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(10,110,154,.40)}

.subnav{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 10px}
.diet-row{display:flex;gap:5px}
.diet-btn{
  padding:5px 12px;border-radius:30px;border:1.5px solid var(--ink4);
  cursor:pointer;font-size:11px;font-weight:900;
  font-family:'Nunito',sans-serif;color:var(--ink3);background:none;
  transition:all .18s;letter-spacing:.04em;text-transform:uppercase;
}
.diet-btn.veg-on{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 2px 10px rgba(42,157,143,.35)}
.diet-btn.nv-on{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 2px 10px rgba(192,122,74,.30)}

.day-nav{display:flex;align-items:center;gap:6px}
.day-arrow{
  width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border2);
  background:none;color:var(--accent2);cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;transition:all .14s;
}
.day-arrow:active{background:var(--border);transform:scale(.9)}
.day-lbl{font-size:15px;font-weight:900;color:var(--ink);min-width:82px;text-align:center;letter-spacing:-.2px}
.veg-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 5px var(--teal);display:none;flex-shrink:0;margin-left:-3px}

.stats-zone{background:var(--deep);border-top:1px solid var(--ink4);border-bottom:1px solid var(--ink4)}
.stats{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr 1px 1fr;padding:10px 14px 8px}
.stats-sep{background:var(--ink4);margin:3px 0}
.stat{padding:2px 6px;text-align:center}
.stat-val{font-size:22px;font-weight:900;color:var(--ink);display:block;letter-spacing:-.8px;line-height:1}
.stat-val.hi{color:var(--accent2)}
.stat-lbl{font-size:8px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;margin-top:2px;display:block}

.cal-bar-zone{background:var(--deep);padding:0 14px 10px}
.cal-bar-track{height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.cal-bar-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.body{padding:10px 12px 0}
.shuffle-btn{
  width:100%;padding:12px;background:var(--accent);border:none;border-radius:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;
  color:#fff;letter-spacing:.05em;text-transform:uppercase;
  box-shadow:0 3px 16px rgba(10,110,154,.35);transition:all .16s;margin-bottom:10px;
}
.shuffle-btn:active{transform:scale(.97) translateY(1px)}
.s-ico{font-size:17px;display:inline-block;transition:transform .4s}
.shuffle-btn:active .s-ico{transform:rotate(180deg)}
.mode-note{
  font-size:10.5px;font-weight:700;color:var(--ink3);text-align:center;
  margin-bottom:10px;background:var(--ink4);border-radius:7px;
  padding:6px 12px;border:1px solid var(--border);
}

.meals{display:flex;flex-direction:column;gap:9px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;transition:transform .13s}
.card:active{transform:scale(.99)}
.card-inner{display:flex;min-height:0}
.card-accent{width:4px;flex-shrink:0}
.card-main{flex:1;min-width:0}
.card-body{padding:11px 12px 10px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.card-type{font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.ct-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.card-kcal{font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.card-name{font-size:19px;font-weight:900;color:var(--ink);line-height:1.15;margin-bottom:4px;letter-spacing:-.5px}
.card-desc{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.5}
.card-ft{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid var(--ink4)}
.tags{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-width:0}
.tag{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:4px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.t-pro{background:rgba(56,189,248,.12);color:#7DD3F8;border:1px solid rgba(56,189,248,.20)}
.t-lc{background:rgba(42,157,143,.13);color:#5BBFB5;border:1px solid rgba(42,157,143,.22)}
.t-gi{background:rgba(192,122,74,.13);color:#D4A47A;border:1px solid rgba(192,122,74,.22)}
.t-cheat{background:rgba(123,111,196,.13);color:#A89FD8;border:1px solid rgba(123,111,196,.22)}
.t-veg{background:rgba(42,157,143,.13);color:#5BBFB5;border:1px solid rgba(42,157,143,.22)}
.t-nv{background:rgba(192,122,74,.13);color:#D4A47A;border:1px solid rgba(192,122,74,.22)}
.swap-btn{
  flex-shrink:0;background:transparent;border:1.5px solid var(--border2);
  color:var(--accent2);font-size:9.5px;font-weight:900;
  padding:4px 10px;border-radius:7px;cursor:pointer;
  font-family:'Nunito',sans-serif;letter-spacing:.05em;text-transform:uppercase;
  display:flex;align-items:center;gap:3px;transition:all .14s;margin-left:6px;
}
.swap-btn:active{transform:scale(.92);background:var(--border)}

.card-macros{background:var(--deep);padding:8px 12px;display:flex;border-top:1px solid var(--ink4)}
.cmac{flex:1;text-align:center;font-size:9px;font-weight:800;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.cmac strong{display:block;font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.4px;line-height:1.1;margin-bottom:1px}
.cmac+.cmac{border-left:1px solid var(--ink4)}

[data-t=breakfast] .card-accent{background:#C07A4A;box-shadow:2px 0 10px rgba(192,122,74,.28)}
[data-t=breakfast] .card-type{color:#D4A47A}
[data-t=breakfast] .ct-dot{background:#C07A4A}
[data-t=breakfast] .card-kcal{background:rgba(192,122,74,.12);color:#D4A47A;border:1px solid rgba(192,122,74,.20)}
[data-t=lunch] .card-accent{background:#0A6E9A;box-shadow:2px 0 10px rgba(10,110,154,.35)}
[data-t=lunch] .card-type{color:#38BDF8}
[data-t=lunch] .ct-dot{background:#0A6E9A}
[data-t=lunch] .card-kcal{background:rgba(56,189,248,.12);color:#7DD3F8;border:1px solid rgba(56,189,248,.20)}
[data-t=snacks] .card-accent{background:#2A9D8F;box-shadow:2px 0 10px rgba(42,157,143,.30)}
[data-t=snacks] .card-type{color:#5BBFB5}
[data-t=snacks] .ct-dot{background:#2A9D8F}
[data-t=snacks] .card-kcal{background:rgba(42,157,143,.12);color:#5BBFB5;border:1px solid rgba(42,157,143,.20)}
[data-t=dinner] .card-accent{background:#7B6FC4;box-shadow:2px 0 10px rgba(123,111,196,.30)}
[data-t=dinner] .card-type{color:#A89FD8}
[data-t=dinner] .ct-dot{background:#7B6FC4}
[data-t=dinner] .card-kcal{background:rgba(123,111,196,.12);color:#A89FD8;border:1px solid rgba(123,111,196,.20)}
[data-t=beverage] .card-accent{background:#1A6B8A;box-shadow:2px 0 10px rgba(26,107,138,.28)}
[data-t=beverage] .card-type{color:#5AAEC4}
[data-t=beverage] .ct-dot{background:#1A6B8A}
[data-t=beverage] .card-kcal{background:rgba(26,107,138,.12);color:#5AAEC4;border:1px solid rgba(26,107,138,.20)}

.card.checked{border-color:rgba(42,157,143,.30)}

.check-btn{
  flex-shrink:0;width:26px;height:26px;border-radius:6px;
  border:2px solid var(--border2);background:rgba(255,255,255,.03);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s;margin-left:6px;font-size:0;
}
.check-btn.done{
  background:var(--teal);border-color:var(--teal);
  box-shadow:0 2px 8px rgba(42,157,143,.40);
  font-size:13px;font-weight:900;color:#fff;font-family:'Nunito',sans-serif;
}
.check-btn.done::after{content:'✓'}
.check-btn:not(.done):hover{border-color:var(--border2);background:rgba(255,255,255,.06)}
.check-btn:active{transform:scale(.84)}

.bev-card{background:var(--card);border-radius:14px;border:1px solid rgba(26,107,138,.20);overflow:hidden}
.bev-inner{display:flex;align-items:stretch}
.bev-accent{width:4px;background:#1A6B8A;box-shadow:2px 0 8px rgba(26,107,138,.28);flex-shrink:0}
.bev-body{flex:1;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bev-label{display:flex;align-items:center;gap:6px}
.bev-title{font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#5AAEC4}
.bev-name{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.3px;cursor:pointer}
.bev-right{display:flex;align-items:center;gap:6px}
.bev-pills{display:flex;gap:4px;flex-wrap:wrap}
.bev-pill{
  padding:4px 10px;border-radius:20px;border:1.5px solid rgba(56,189,248,.16);
  background:none;color:var(--ink3);
  font-size:10px;font-weight:900;font-family:'Nunito',sans-serif;
  cursor:pointer;transition:all .15s;letter-spacing:.04em;
}
.bev-pill.on{background:#0A6E9A;color:#fff;border-color:#0A6E9A;box-shadow:0 1px 8px rgba(10,110,154,.30)}

.log-btn-row{padding:10px 12px 0;display:flex;gap:8px}
.log-btn{
  flex:1;padding:11px;border-radius:12px;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.log-btn.save{background:var(--accent);color:#fff;box-shadow:0 3px 14px rgba(10,110,154,.32)}
.log-btn.save:active{transform:scale(.97)}
.log-btn.history{background:var(--ink4);color:var(--ink2);border:1px solid var(--border2)}
.log-btn.history:active{transform:scale(.97)}

.log-panel{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.log-panel.open{display:flex}
.log-sheet{background:var(--night);border:1px solid var(--frame);border-radius:20px 20px 0 0;width:100%;max-width:420px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.log-sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--ink4);flex-shrink:0}
.log-sheet-title{font-size:17px;font-weight:900;color:var(--ink);letter-spacing:-.4px}
.log-actions{display:flex;gap:8px;align-items:center}
.log-export-btn{padding:6px 14px;border-radius:8px;background:var(--accent);border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:10px;font-weight:900;color:#fff;letter-spacing:.05em;text-transform:uppercase}
.log-close-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--ink4);background:none;color:var(--ink3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.log-list{overflow-y:auto;flex:1;padding:12px}
.log-empty{text-align:center;padding:40px 20px;color:var(--ink3);font-size:13px;font-weight:700}
.log-entry{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.log-entry-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px;border-bottom:1px solid var(--ink4)}
.log-date{font-size:13px;font-weight:900;color:var(--ink);letter-spacing:-.2px}
.log-kcal{font-size:11px;font-weight:800;color:var(--accent2)}
.log-del-btn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(192,122,74,.28);background:none;color:rgba(192,122,74,.7);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s}
.log-del-btn:active{background:rgba(192,122,74,.14);transform:scale(.88)}
.log-meals{padding:8px 12px 10px;display:flex;flex-direction:column;gap:4px}
.log-meal-row{display:flex;align-items:baseline;gap:6px}
.log-meal-icon{font-size:12px;flex-shrink:0}
.log-meal-name{font-size:12px;font-weight:700;color:var(--ink2);flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.log-meal-cal{font-size:10px;font-weight:800;color:var(--ink3);flex-shrink:0}

.footer{text-align:center;padding:18px 14px 0;font-size:9.5px;font-weight:800;color:var(--ink3);letter-spacing:.07em;line-height:2;text-transform:uppercase}
.footer span{color:var(--accent2);font-weight:900}
</style>
</head>
<body>
<div class="app">

<div class="status-bar-spacer"></div>
<div class="hdr">
  <div class="logo-row">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8"  cy="10" r="5" fill="#141C22"/><circle cx="8"  cy="10" r="3.5" fill="#E2EBF0"/>
          <circle cx="18" cy="10" r="5" fill="#141C22"/><circle cx="18" cy="10" r="3.5" fill="#E2EBF0"/>
          <circle cx="13" cy="18" r="5" fill="#141C22"/><circle cx="13" cy="18" r="3.5" fill="#E2EBF0"/>
          <circle cx="8"  cy="10" r="2.4" fill="#2A9D8F"/>
          <circle cx="18" cy="10" r="2.4" fill="#C07A4A"/>
          <circle cx="13" cy="18" r="2.4" fill="#7B6FC4"/>
          <circle cx="13" cy="13" r="2.8" fill="#141C22"/><circle cx="13" cy="13" r="1.6" fill="#38BDF8"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">EatRight</div>
        <div class="logo-sub">High Protein · Low Carb · Eat Right</div>
      </div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab on" id="tabR" onclick="setMode('R')">Regular</button>
      <button class="mode-tab"    id="tabD" onclick="setMode('D')">Low-GI</button>
      <button class="mode-tab"    id="tabC" onclick="setMode('C')">Treat Day</button>
    </div>
  </div>
  <div class="subnav">
    <div class="diet-row">
      <button class="diet-btn veg-on" id="btnVeg" onclick="setDiet('veg')">🌿 Veg</button>
      <button class="diet-btn"        id="btnNv"  onclick="setDiet('nv')">🍗 Non-Veg</button>
    </div>
    <div class="day-nav">
      <button class="day-arrow" onclick="chgDay(-1)">‹</button>
      <div class="day-lbl" id="dayLbl"></div>
      <div class="veg-dot" id="vegDot"></div>
      <button class="day-arrow" onclick="chgDay(1)">›</button>
    </div>
  </div>
</div>

<div class="stats-zone">
  <div class="stats">
    <div class="stat"><span class="stat-val hi" id="sKcal">0</span><span class="stat-lbl">kcal</span></div>
    <div class="stats-sep"></div>
    <div class="stat"><span class="stat-val" id="sPro">0g</span><span class="stat-lbl">Protein</span></div>
    <div class="stats-sep"></div>
    <div class="stat"><span class="stat-val" id="sCarb">0g</span><span class="stat-lbl">Carbs</span></div>
    <div class="stats-sep"></div>
    <div class="stat"><span class="stat-val" id="sFat">0g</span><span class="stat-lbl">Fat</span></div>
  </div>
  <div class="cal-bar-zone">
    <div class="cal-bar-track"><div class="cal-bar-fill" id="calBar" style="width:0%"></div></div>
  </div>
</div>

<div class="body">
  <button class="shuffle-btn" onclick="shuffleAll()"><span class="s-ico">⟳</span> Shuffle All Meals</button>
  <div class="mode-note" id="modeNote"></div>
  <div class="meals" id="meals"></div>

  <!-- Beverage picker -->
  <div style="margin-top:9px" id="bevCard">
    <div class="bev-card">
      <div class="bev-inner">
        <div class="bev-accent" style="background:#8C7040"></div>
        <div class="bev-body">
          <div>
            <div class="bev-label"><div class="ct-dot" style="background:#F4C430"></div><span class="bev-title">☕ Beverages</span></div>
            <div class="bev-name" id="bevName">Masala Chai</div>
          </div>
          <div class="bev-right">
            <div class="bev-pills" id="bevPills"></div>
            <button class="check-btn" id="bevCheck" onclick="toggleBevCheck()"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Log day buttons -->
  <div class="log-btn-row">
    <button class="log-btn save" onclick="logDay()">📋 Log Today</button>
    <button class="log-btn history" onclick="openLog()">📅 History</button>
  </div>
</div>

<!-- Log history panel -->
<div class="log-panel" id="logPanel" onclick="panelBgClick(event)">
  <div class="log-sheet">
    <div class="log-sheet-hdr">
      <div class="log-sheet-title">📅 Day Log</div>
      <div class="log-actions">
        <button class="log-export-btn" onclick="exportLog()">⬇ Export</button>
        <button class="log-close-btn" onclick="closeLog()">✕</button>
      </div>
    </div>
    <div class="log-list" id="logList"></div>
  </div>
</div>

// ── MEAL POOL & PICK ──
function pool(t){
  const src=vegOn()?DB[t].veg:[...DB[t].veg,...DB[t].nonveg];
  const f=src.filter(m=>m.m.includes(mode));
  return f.length?f:src;
}
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}

function pickDiff(t, cur){
  const p=pool(t);
  if(p.length<2) return p[0];
  let slice=p;
  if(t==='lunch'||t==='dinner'){
    const indianSlice=Math.max(4,Math.floor(p.length*0.4));
    slice=(Math.random()<0.70)?p.slice(0,indianSlice):p;
    if(slice.length===1&&slice[0].n===cur?.n) slice=p;
  }
  const candidates=slice.filter(m=>m.n!==cur?.n);
  if(candidates.length) return candidates[Math.floor(Math.random()*candidates.length)];
  return rnd(p);
}

function seed(){
  picks={}; checked={};
  const base=dayIdx*137+new Date().getDate()*31+(vegOn()?0:500)+(mode==='R'?0:mode==='D'?200:400);
  TYPES.forEach((t,i)=>{
    const p=pool(t);
    let candidate;
    if(t==='lunch'||t==='dinner'){
      const indianSlice=Math.max(4,Math.floor(p.length*0.4));
      const useIndian=((base+i*73)%10)<6;
      const slice=useIndian?p.slice(0,indianSlice):p;
      candidate=slice[(base+i*73+i*i*11)%slice.length];
    } else {
      candidate=p[(base+i*73+i*i*11)%p.length];
    }
    picks[t]=candidate;
  });
}

function shuffleAll(){
  picks={}; checked={};
  TYPES.forEach(t=>{picks[t]=pickDiff(t,null)});
  render();
}
function swap(t){picks[t]=pickDiff(t,picks[t]);delete checked[t];render()}
function toggleCheck(t){
  checked[t]=!checked[t];
  render();
}
function chgDay(d){dayIdx=(dayIdx+d+7)%7;seed();render()}
function setMode(m){
  mode=m;
  ['R','D','C'].forEach(x=>document.getElementById('tab'+x).className='mode-tab'+(mode===x?' on':''));
  seed();render();
}
function setDiet(d){
  diet=d;
  document.getElementById('btnVeg').className='diet-btn'+(d==='veg'?' veg-on':'');
  document.getElementById('btnNv').className='diet-btn'+(d==='nv'?' nv-on':'');
  seed();render();
}

// ── RENDER ──
function render(){
  document.getElementById('dayLbl').textContent=DAYS[dayIdx];
  document.getElementById('vegDot').style.display=isVegDay(dayIdx)?'flex':'none';
  const tot=TYPES.reduce((s,t)=>s+(picks[t]?.cal||0),0);
  const totP=TYPES.reduce((s,t)=>s+(picks[t]?.p||0),0);
  const totC=TYPES.reduce((s,t)=>s+(picks[t]?.c||0),0);
  const totF=TYPES.reduce((s,t)=>s+(picks[t]?.f||0),0);
  document.getElementById('sKcal').textContent=tot;
  document.getElementById('sPro').textContent=totP+'g';
  const carbEl=document.getElementById('sCarb');
  carbEl.textContent=totC+'g';
  carbEl.style.color=totC>CARB_CAP?'#C05040':'';
  document.getElementById('sFat').textContent=totF+'g';
  const calTarget=CAL_TARGET[mode];
  const pct=Math.min(100,Math.round(tot/calTarget*100));
  const b=document.getElementById('calBar');
  b.style.width=pct+'%';
  const barCol=tot>calTarget*1.05?'#C05040':tot>calTarget*0.9?'#8A9A40':'#0A6E9A';
  b.style.background=barCol;
  b.style.boxShadow=`0 0 6px ${barCol}50`;
  document.getElementById('modeNote').textContent=MODE_NOTE[mode];
  const wrap=document.getElementById('meals');wrap.innerHTML='';
  TYPES.forEach(t=>{
    const m=picks[t];if(!m)return;
    const isNV=(DB[t].nonveg||[]).includes(m);
    const isDone=!!checked[t];
    let tags='';
    if(m.p>=20)tags+='<span class="tag t-pro">High Protein</span>';
    if(m.c<20)tags+='<span class="tag t-lc">Low Carb</span>';
    if(mode==='D')tags+='<span class="tag t-gi">Low GI</span>';
    if(mode==='C')tags+='<span class="tag t-cheat">Treat Day</span>';
    tags+=`<span class="tag ${isNV?'t-nv':'t-veg'}">${isNV?'Non-Veg':'Veg'}</span>`;
    const c=document.createElement('div');
    c.className='card';c.setAttribute('data-t',t);
    c.innerHTML=`
<div class="card-inner">
  <div class="card-accent"></div>
  <div class="card-main">
    <div class="card-body">
      <div class="card-hd">
        <div class="card-type"><div class="ct-dot"></div>${T_ICON[t]} ${T_LBL[t]}</div>
        <span class="card-kcal">${m.cal} kcal</span>
      </div>
      <div class="card-name">${m.n}</div>
      <div class="card-desc">${m.d}</div>
      <div class="card-ft">

        </div>

// ── DAY LOGGING ──
const LOG_KEY='eatright_log';

function getLog(){
  try{return JSON.parse(localStorage.getItem(LOG_KEY)||'[]')}catch{return[]}
}
function saveLog(entries){
  localStorage.setItem(LOG_KEY,JSON.stringify(entries));
}

function logDay(){
  const today=new Date();
  const dateStr=today.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const meals=TYPES.map(t=>({
    type:t,
    icon:T_ICON[t],
    name:picks[t]?.n||'—',
    cal:picks[t]?.cal||0,
    done:!!checked[t]
  }));
  const bev=BEVERAGES[bevCat][bevIdx];
  meals.push({type:'beverage',icon:'☕',name:bev.n,cal:bev.cal,done:bevChecked});
  const totalCal=meals.reduce((s,m)=>s+m.cal,0);
  const entry={
    id:Date.now(),
    date:dateStr,
    mode,diet,
    totalCal,
    meals
  };
  const log=getLog();
  // replace if same date already logged
  const idx=log.findIndex(e=>e.date===dateStr);
  if(idx>=0) log[idx]=entry; else log.unshift(entry);
  saveLog(log);
  // visual feedback
  const btn=document.querySelector('.log-btn.save');
  const orig=btn.innerHTML;
  btn.innerHTML='✅ Logged!';btn.style.background='#2A9D8F';
  setTimeout(()=>{btn.innerHTML=orig;btn.style.background='';},1800);
}

function openLog(){
  renderLogList();
  document.getElementById('logPanel').classList.add('open');
}
function closeLog(){
  document.getElementById('logPanel').classList.remove('open');
}
function panelBgClick(e){
  if(e.target===document.getElementById('logPanel')) closeLog();
}

function deleteEntry(id){
  const log=getLog().filter(e=>e.id!==id);
  saveLog(log);
  renderLogList();
}

      <div style="font-size:10px;color:var(--ink3);font-weight:700;margin-top:2px">${e.mode==='R'?'Regular':e.mode==='D'?'Low-GI':'Treat Day'} · ${e.diet==='veg'?'🌿 Veg':'🍗 Non-Veg'}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="log-kcal">${e.totalCal} kcal</span>
      <button class="log-del-btn" onclick="deleteEntry(${e.id})">✕</button>
    </div>
  </div>
  <div class="log-meals">
    ${e.meals.map(m=>`
      <div class="log-meal-row">
        <span class="log-meal-icon">${m.done?'✅':m.icon}</span>
        <span class="log-meal-name">${m.name}</span>
        <span class="log-meal-cal">${m.cal} kcal</span>
      </div>`).join('')}
  </div>
</div>`).join('');
}

function exportLog(){
  const log=getLog();
  if(!log.length){alert('No log entries yet!');return;}
  let txt='EatRight — Day Log Export\n';
  txt+='='.repeat(40)+'\n\n';
  log.forEach(e=>{
    txt+=`📅 ${e.date}  [${e.mode==='R'?'Regular':e.mode==='D'?'Low-GI':'Treat Day'} · ${e.diet==='veg'?'Veg':'Non-Veg'}]\n`;
    txt+=`Total: ${e.totalCal} kcal\n`;
    e.meals.forEach(m=>{
      txt+=`  ${m.done?'✓':' '} ${m.icon} ${m.name}  (${m.cal} kcal)\n`;
    });
    txt+='\n';
  });
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='eatright-log.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

window.shuffleAll=shuffleAll;window.swap=swap;window.chgDay=chgDay;window.setMode=setMode;window.setDiet=setDiet;
window.toggleCheck=toggleCheck;window.setBevCat=setBevCat;window.toggleBevCheck=toggleBevCheck;
window.logDay=logDay;window.openLog=openLog;window.closeLog=closeLog;
window.panelBgClick=panelBgClick;window.deleteEntry=deleteEntry;window.exportLog=exportLog;
seed();render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js',{scope:'/'})
      .catch(err=>console.warn('SW reg failed:',err));
  });
}
</script>
