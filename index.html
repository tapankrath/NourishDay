<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EatRight">
<meta name="theme-color" content="#061A12">
<meta name="description" content="Daily meal plans — high protein, low carb. Regular, diabetic & cheat-day modes.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>EatRight — Daily Meal Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --night:#061A12;--deep:#0A2B1C;--green:#00C06B;--lime:#ADFF5C;
  --orange:#FF6B2B;--blue:#2B8EFF;--teal:#00C8A0;--purple:#9B5DFF;
  --ink:#FFFFFF;--ink2:rgba(255,255,255,.78);--ink3:rgba(255,255,255,.44);--ink4:rgba(255,255,255,.12);
  --card:#0F2A1D;--border:rgba(0,192,107,.15);--border2:rgba(0,192,107,.28);--bg:#020E08;
  /* page frame */
  --frame:rgba(0,192,107,.22);
}
html,body{
  background:var(--bg);
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--ink);min-height:100%;
  overscroll-behavior:none;
}

/* ── PAGE FRAME ── */
/* On wider screens the app gets a visible border/glow */
.app{
  max-width:420px;
  margin:0 auto;
  padding-bottom:56px;
  position:relative;
  /* outer glow border */
  box-shadow:
    0 0 0 1px var(--frame),
    0 0 32px rgba(0,192,107,.08),
    0 0 0 4px rgba(0,192,107,.04);
  min-height:100vh;
  background:var(--night);
}
/* thin neon top edge */
.app::before{
  content:'';
  position:fixed;
  top:0;left:50%;
  transform:translateX(-50%);
  width:min(420px,100vw);
  height:2px;
  background:linear-gradient(90deg,transparent 5%,var(--green) 40%,var(--lime) 60%,transparent 95%);
  opacity:.7;
  z-index:10;
  pointer-events:none;
}

/* ── HEADER ── */
.status-bar-spacer{background:var(--night);height:max(env(safe-area-inset-top),44px)}
.hdr{background:var(--night);padding:10px 14px 0;position:relative}
.hdr::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.3;
}

.logo-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{
  width:38px;height:38px;background:var(--green);border-radius:11px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 0 16px rgba(0,192,107,.5);
}
.logo-mark svg{width:22px;height:22px}
.logo-name{
  font-size:24px;font-weight:900;color:#fff;
  letter-spacing:-.8px;line-height:1;
}
.logo-sub{
  font-size:9px;font-weight:800;color:var(--green);
  margin-top:2px;letter-spacing:.12em;text-transform:uppercase;
}

/* Mode tabs */
.mode-tabs{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:3px;gap:2px;border:1px solid var(--ink4)}
.mode-tab{
  padding:6px 10px;border-radius:7px;border:none;cursor:pointer;
  font-size:10px;font-weight:900;font-family:'Nunito',sans-serif;
  color:var(--ink3);background:none;transition:all .18s;
  white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;
}
.mode-tab.on{background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(0,192,107,.5)}

/* ── SUBNAV ── */
.subnav{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 10px}
.diet-row{display:flex;gap:5px}
.diet-btn{
  padding:5px 12px;border-radius:30px;border:1.5px solid var(--ink4);
  cursor:pointer;font-size:11px;font-weight:900;
  font-family:'Nunito',sans-serif;color:var(--ink3);background:none;
  transition:all .18s;letter-spacing:.04em;text-transform:uppercase;
}
.diet-btn.veg-on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 12px rgba(0,192,107,.4)}
.diet-btn.nv-on{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 2px 12px rgba(255,107,43,.4)}

.day-nav{display:flex;align-items:center;gap:6px}
.day-arrow{
  width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border2);
  background:none;color:var(--green);cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;transition:all .14s;
}
.day-arrow:active{background:var(--border);transform:scale(.9)}
.day-lbl{font-size:15px;font-weight:900;color:#fff;min-width:82px;text-align:center;letter-spacing:-.2px}
.veg-dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime);display:none;flex-shrink:0;margin-left:-3px}

/* ── STATS ── */
.stats-zone{background:var(--deep);border-top:1px solid var(--ink4);border-bottom:1px solid var(--ink4)}
.stats{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr 1px 1fr;padding:10px 14px 8px}
.stats-sep{background:var(--ink4);margin:3px 0}
.stat{padding:2px 6px;text-align:center}
.stat-val{
  font-size:22px;font-weight:900;color:#fff;
  display:block;letter-spacing:-.8px;line-height:1;
}
.stat-val.hi{color:var(--lime)}
.stat-lbl{
  font-size:8px;font-weight:800;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.12em;margin-top:2px;display:block;
}

/* ── CAL BAR ── */
.cal-bar-zone{background:var(--deep);padding:0 14px 10px}
.cal-bar-track{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.cal-bar-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── BODY ── */
.body{padding:10px 12px 0}
.shuffle-btn{
  width:100%;padding:12px;background:var(--lime);border:none;border-radius:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;
  color:#061A12;letter-spacing:.05em;text-transform:uppercase;
  box-shadow:0 4px 20px rgba(173,255,92,.35);transition:all .16s;margin-bottom:10px;
}
.shuffle-btn:active{transform:scale(.97) translateY(1px);box-shadow:0 2px 8px rgba(173,255,92,.2)}
.s-ico{font-size:17px;display:inline-block;transition:transform .4s}
.shuffle-btn:active .s-ico{transform:rotate(180deg)}
.mode-note{
  font-size:10.5px;font-weight:700;color:var(--ink3);text-align:center;
  margin-bottom:10px;letter-spacing:.03em;
  background:var(--ink4);border-radius:7px;padding:6px 12px;border:1px solid var(--border);
}

/* ── CARDS ── */
.meals{display:flex;flex-direction:column;gap:9px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;transition:transform .13s}
.card:active{transform:scale(.99)}
.card-inner{display:flex;min-height:0}
.card-accent{width:4px;flex-shrink:0}
.card-main{flex:1;min-width:0}
.card-body{padding:11px 12px 10px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.card-type{
  font-size:9.5px;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;display:flex;align-items:center;gap:5px;
}
.ct-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.card-kcal{font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:20px;letter-spacing:.02em}

/* BIGGER, BOLDER meal name */
.card-name{
  font-size:19px;font-weight:900;color:#fff;
  line-height:1.15;margin-bottom:4px;letter-spacing:-.5px;
}
.card-desc{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.5}

.card-ft{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid var(--ink4)}
.tags{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-width:0}
.tag{
  font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:4px;
  letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
}
.t-pro{background:rgba(43,142,255,.18);color:#6AB8FF;border:1px solid rgba(43,142,255,.25)}
.t-lc{background:rgba(0,192,107,.15);color:#4DFFAB;border:1px solid rgba(0,192,107,.25)}
.t-gi{background:rgba(255,107,43,.15);color:#FF9D6B;border:1px solid rgba(255,107,43,.25)}
.t-cheat{background:rgba(255,205,0,.12);color:#FFD84D;border:1px solid rgba(255,205,0,.25)}
.t-veg{background:rgba(173,255,92,.12);color:#ADFF5C;border:1px solid rgba(173,255,92,.25)}
.t-nv{background:rgba(255,107,43,.15);color:#FF9D6B;border:1px solid rgba(255,107,43,.25)}
.swap-btn{
  flex-shrink:0;background:transparent;border:1.5px solid var(--border2);
  color:var(--green);font-size:9.5px;font-weight:900;
  padding:4px 10px;border-radius:7px;cursor:pointer;
  font-family:'Nunito',sans-serif;letter-spacing:.05em;text-transform:uppercase;
  display:flex;align-items:center;gap:3px;transition:all .14s;margin-left:6px;
}
.swap-btn:active{transform:scale(.92);background:var(--border)}

/* Macros */
.card-macros{background:var(--deep);padding:8px 12px;display:flex;border-top:1px solid var(--ink4)}
.cmac{flex:1;text-align:center;font-size:9px;font-weight:800;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.cmac strong{display:block;font-size:15px;font-weight:900;color:#fff;letter-spacing:-.4px;line-height:1.1;margin-bottom:1px}
.cmac+.cmac{border-left:1px solid var(--ink4)}

/* Meal type themes */
[data-t=breakfast] .card-accent{background:#FF6B2B;box-shadow:2px 0 12px rgba(255,107,43,.4)}
[data-t=breakfast] .card-type{color:#FF8D5C}
[data-t=breakfast] .ct-dot{background:#FF6B2B}
[data-t=breakfast] .card-kcal{background:rgba(255,107,43,.15);color:#FF8D5C;border:1px solid rgba(255,107,43,.2)}
[data-t=lunch] .card-accent{background:#2B8EFF;box-shadow:2px 0 12px rgba(43,142,255,.4)}
[data-t=lunch] .card-type{color:#6AB8FF}
[data-t=lunch] .ct-dot{background:#2B8EFF}
[data-t=lunch] .card-kcal{background:rgba(43,142,255,.15);color:#6AB8FF;border:1px solid rgba(43,142,255,.2)}
[data-t=snacks] .card-accent{background:#00C8A0;box-shadow:2px 0 12px rgba(0,200,160,.4)}
[data-t=snacks] .card-type{color:#33D9B8}
[data-t=snacks] .ct-dot{background:#00C8A0}
[data-t=snacks] .card-kcal{background:rgba(0,200,160,.15);color:#33D9B8;border:1px solid rgba(0,200,160,.2)}
[data-t=dinner] .card-accent{background:#9B5DFF;box-shadow:2px 0 12px rgba(155,93,255,.4)}
[data-t=dinner] .card-type{color:#BA8FFF}
[data-t=dinner] .ct-dot{background:#9B5DFF}
[data-t=dinner] .card-kcal{background:rgba(155,93,255,.15);color:#BA8FFF;border:1px solid rgba(155,93,255,.2)}

/* ── FOOTER ── */
.footer{
  text-align:center;padding:18px 14px 0;
  font-size:9.5px;font-weight:800;color:var(--ink3);
  letter-spacing:.07em;line-height:2;text-transform:uppercase;
}
.footer span{color:var(--green);font-weight:900}
</style>
</head>
<body>
<div class="app">

<div class="status-bar-spacer"></div>
<div class="hdr">
  <div class="logo-row">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8"  cy="10" r="5" fill="#061A12"/><circle cx="8"  cy="10" r="3.5" fill="#FDF6E3"/>
          <circle cx="18" cy="10" r="5" fill="#061A12"/><circle cx="18" cy="10" r="3.5" fill="#FDF6E3"/>
          <circle cx="13" cy="18" r="5" fill="#061A12"/><circle cx="13" cy="18" r="3.5" fill="#FDF6E3"/>
          <circle cx="8"  cy="10" r="2.4" fill="#00C8A0"/>
          <circle cx="18" cy="10" r="2.4" fill="#FF6B2B"/>
          <circle cx="13" cy="18" r="2.4" fill="#9B5DFF"/>
          <circle cx="13" cy="13" r="2.8" fill="#061A12"/><circle cx="13" cy="13" r="1.6" fill="#ADFF5C"/>

        <div class="logo-name">EatRight</div>
        <div class="logo-sub">High Protein · Low Carb · Global</div>
      </div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab on" id="tabR" onclick="setMode('R')">Regular</button>
      <button class="mode-tab"    id="tabD" onclick="setMode('D')">Diabetic</button>
      <button class="mode-tab"    id="tabC" onclick="setMode('C')">Cheat</button>
    </div>
  </div>
  <div class="subnav">
    <div class="diet-row">
      <button class="diet-btn veg-on" id="btnVeg" onclick="setDiet('veg')">🌿 Veg</button>

      <div class="veg-dot" id="vegDot"></div>
      <button class="day-arrow" onclick="chgDay(1)">›</button>
    </div>
  </div>
</div>

<div class="stats-zone">
  <div class="stats">
    <div class="stat"><span class="stat-val hi" id="sKcal">0</span><span class="stat-lbl">kcal</span></div>
    <div class="stats-sep"></div>
    <div class="stat"><span class="stat-val" id="sPro">0g</span><span class="stat-lbl">Protein</span></div>
    <div class="stats-sep"></div>
    <div class="stat"><span class="stat-val" id="sCarb">0g</span><span class="stat-lbl">Carbs</span></div>
    <div class="stats-sep"></div>
    <div class="stat"><span class="stat-val" id="sFat">0g</span><span class="stat-lbl">Fat</span></div>
  </div>
  <div class="cal-bar-zone">
    <div class="cal-bar-track"><div class="cal-bar-fill" id="calBar" style="width:0%"></div></div>
  </div>
</div>

<div class="body">
  <button class="shuffle-btn" onclick="shuffleAll()"><span class="s-ico">⟳</span> Shuffle All Meals</button>
  <div class="mode-note" id="modeNote"></div>
  <div class="meals" id="meals"></div>
</div>

<div class="footer">
  No beef · pork · cheese · turkey · sausage · pasta<br>
  Veg enforced Mon &amp; Thu &nbsp;·&nbsp; <span>EatRight</span>
</div>
</div>

// ─────────────────────────────────────────────────────────────────────
// LOGIC
// ─────────────────────────────────────────────────────────────────────
let dayIdx=new Date().getDay(), diet='veg', mode='R', picks={};
const isVegDay=d=>VEG_DAYS.includes(d);
const vegOn=()=>isVegDay(dayIdx)||diet==='veg';

function pool(t){
  const src=vegOn()?DB[t].veg:[...DB[t].veg,...DB[t].nonveg];
  const f=src.filter(m=>m.m.includes(mode));
  return f.length?f:src; // always fallback to full src so pool never empty
}

function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}

// Remaining carb budget for slot t
function carbBudget(t){
  return CARB_CAP - TYPES.filter(x=>x!==t).reduce((s,x)=>s+(picks[x]?.c||0),0);
}

// Pick a random item within carb budget, different from cur
// Falls back to lowest-carb if budget is too tight
function pickBudgeted(t,cur){
  const p=pool(t);
  const budget=carbBudget(t);
  const fits=p.filter(m=>m.c<=budget&&m.n!==cur?.n);
  if(fits.length) return fits[Math.floor(Math.random()*fits.length)];
  // fallback: any item that's different from cur, lowest carb first
  const diff=p.filter(m=>m.n!==cur?.n);
  if(diff.length) return diff.slice().sort((a,b)=>a.c-b.c)[0];
  return p[0];
}

function seed(){
  picks={};
  const base=dayIdx*137+new Date().getDate()*31+(vegOn()?0:500)+(mode==='R'?0:mode==='D'?200:400);
  TYPES.forEach((t,i)=>{
    const p=pool(t);
    const candidate=p[(base+i*73+i*i*11)%p.length];
    const budget=carbBudget(t);
    if(candidate.c<=budget){
      picks[t]=candidate;
    } else {
      picks[t]=pickBudgeted(t,null);
    }
  });
}

function shuffleAll(){
  picks={};
  TYPES.forEach(t=>{picks[t]=pickBudgeted(t,null)});
  render();
}
function swap(t){picks[t]=pickBudgeted(t,picks[t]);render()}
function chgDay(d){dayIdx=(dayIdx+d+7)%7;seed();render()}
function setMode(m){
  mode=m;
  ['R','D','C'].forEach(x=>document.getElementById('tab'+x).className='mode-tab'+(mode===x?' on':''));
  seed();render();
}
function setDiet(d){
  diet=d;
  document.getElementById('btnVeg').className='diet-btn'+(d==='veg'?' veg-on':'');
  document.getElementById('btnNv').className='diet-btn'+(d==='nv'?' nv-on':'');
  seed();render();
}

function render(){
  document.getElementById('dayLbl').textContent=DAYS[dayIdx];
  document.getElementById('vegDot').style.display=isVegDay(dayIdx)?'flex':'none';
  const tot=TYPES.reduce((s,t)=>s+(picks[t]?.cal||0),0);
  const totP=TYPES.reduce((s,t)=>s+(picks[t]?.p||0),0);
  const totC=TYPES.reduce((s,t)=>s+(picks[t]?.c||0),0);
  const totF=TYPES.reduce((s,t)=>s+(picks[t]?.f||0),0);
  document.getElementById('sKcal').textContent=tot;
  document.getElementById('sPro').textContent=totP+'g';
  const carbEl=document.getElementById('sCarb');
  carbEl.textContent=totC+'g';
  carbEl.style.color=totC>CARB_CAP?'#FF6B2B':'';
  document.getElementById('sFat').textContent=totF+'g';
  const pct=Math.min(100,Math.round(tot/1800*100));
  const b=document.getElementById('calBar');
  b.style.width=pct+'%';
  const barCol=tot>1850?'#FF6B2B':tot>1700?'#FFD84D':'#00C06B';
  b.style.background=barCol;
  b.style.boxShadow=`0 0 10px ${barCol}80`;
  document.getElementById('modeNote').textContent=MODE_NOTE[mode];
  const wrap=document.getElementById('meals');wrap.innerHTML='';
  TYPES.forEach(t=>{
    const m=picks[t];if(!m)return;
    const isNV=(DB[t].nonveg||[]).includes(m);
    let tags='';
    if(m.p>=20)tags+='<span class="tag t-pro">High Protein</span>';
    if(m.c<20)tags+='<span class="tag t-lc">Low Carb</span>';
    if(mode==='D')tags+='<span class="tag t-gi">Low GI</span>';
    if(mode==='C')tags+='<span class="tag t-cheat">Cheat Day</span>';
    tags+=`<span class="tag ${isNV?'t-nv':'t-veg'}">${isNV?'Non-Veg':'Veg'}</span>`;
    const c=document.createElement('div');
    c.className='card';c.setAttribute('data-t',t);
    c.innerHTML=`
<div class="card-inner">
  <div class="card-accent"></div>
  <div class="card-main">
    <div class="card-body">
      <div class="card-hd">
        <div class="card-type"><div class="ct-dot"></div>${T_ICON[t]} ${T_LBL[t]}</div>
        <span class="card-kcal">${m.cal} kcal</span>
      </div>
      <div class="card-name">${m.n}</div>
      <div class="card-desc">${m.d}</div>
      <div class="card-ft">
        <div class="tags">${tags}</div>
        <button class="swap-btn" onclick="swap('${t}')">⟳ Swap</button>
      </div>
    </div>
    <div class="card-macros">
      <div class="cmac"><strong>${m.p}g</strong>Protein</div>
      <div class="cmac"><strong>${m.c}g</strong>Carbs</div>
      <div class="cmac"><strong>${m.f}g</strong>Fat</div>
    </div>
  </div>
</div>`;
    wrap.appendChild(c);
  });
}

window.shuffleAll=shuffleAll;window.swap=swap;window.chgDay=chgDay;window.setMode=setMode;window.setDiet=setDiet;
seed();render();
</script>
</body>
</html>
